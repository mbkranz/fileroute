site_name: fileroute
site_description: Shared-drive adapters and retrieval workflows for SharePoint, Google Drive, and S3.
repo_name: fileroute
repo_url: https://github.com/mbkranz/fileroute
site_url: https://mbkranz.github.io/fileroute/

theme:
  name: material

nav:
  - Home: index.md
  - Workflows:
      - Use cases: use-cases.md
      - Descriptors: descriptors.md
      - Transfers: transfers.md
      - Diagrams: diagram.md
  - Authentication:
      - Provider setup: authentication.md
      - Google Drive: google-auth.md
  - Reference:
      - CLI: cli.md
      - Python API: api.md
  - Development:
      - Contributing and releases: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
