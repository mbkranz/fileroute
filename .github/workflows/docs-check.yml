name: Check generated docs

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          version: "0.12.17"
      - run: uv run --locked --no-dev python scripts/update_docs_markdown.py --check
      - run: make check
