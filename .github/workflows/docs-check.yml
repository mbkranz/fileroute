name: Check generated docs

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          version: "0.12.17"
      - run: uvx --from poethepoet==0.48.0 poe docs-check
      - run: uvx --from poethepoet==0.48.0 poe check
